---
- name: Install Native Kafka Server
  hosts: kafka
  become: true
  vars:
    kafka_version: "2.13-3.8.0"
    kafka_user: "kafka"
    kafka_dir: "/opt/kafka"
    java_home: "/usr/lib/jvm/java-17-openjdk-amd64"
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Java OpenJDK 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Create kafka user
      user:
        name: "{{ kafka_user }}"
        system: yes
        shell: /bin/false
        home: "{{ kafka_dir }}"
        create_home: no

    - name: Create kafka directory
      file:
        path: "{{ kafka_dir }}"
        state: directory
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        mode: '0755'

    - name: Download Kafka
      get_url:
        url: "https://downloads.apache.org/kafka/3.8.0/kafka_{{ kafka_version }}.tgz"
        dest: "/tmp/kafka_{{ kafka_version }}.tgz"

    - name: Extract Kafka
      unarchive:
        src: "/tmp/kafka_{{ kafka_version }}.tgz"
        dest: "{{ kafka_dir }}"
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        remote_src: yes
        extra_opts: [--strip-components=1]

    - name: Create Kafka logs directory
      file:
        path: "{{ kafka_dir }}/logs"
        state: directory
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        mode: '0755'

    - name: Get server IP
      shell: hostname -I | awk '{print $1}'
      register: server_ip

    - name: Configure Kafka server.properties
      copy:
        content: |
          node.id=1
          process.roles=broker,controller
          controller.quorum.voters=1@localhost:9093
          listeners=PLAINTEXT://:9092,CONTROLLER://:9093
          inter.broker.listener.name=PLAINTEXT
          advertised.listeners=PLAINTEXT://{{ server_ip.stdout.strip() }}:9092
          controller.listener.names=CONTROLLER
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          num.network.threads=3
          num.io.threads=8
          socket.send.buffer.bytes=102400
          socket.receive.buffer.bytes=102400
          socket.request.max.bytes=104857600
          log.dirs={{ kafka_dir }}/logs
          num.partitions=1
          num.recovery.threads.per.data.dir=1
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          log.retention.hours=168
          log.segment.bytes=1073741824
          log.retention.check.interval.ms=300000
          zookeeper.connect=localhost:2181
          zookeeper.connection.timeout.ms=18000
          group.initial.rebalance.delay.ms=0
        dest: "{{ kafka_dir }}/config/kraft/server.properties"
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        mode: '0644'

    - name: Create Kafka systemd service
      copy:
        content: |
          [Unit]
          Description=Apache Kafka
          Documentation=http://kafka.apache.org/documentation.html
          Requires=network.target
          After=network.target

          [Service]
          Type=simple
          User={{ kafka_user }}
          ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/kraft/server.properties
          ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
          Restart=on-abnormal

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/kafka.service
        mode: '0644'

    - name: Generate cluster UUID
      shell: "{{ kafka_dir }}/bin/kafka-storage.sh random-uuid"
      register: kafka_uuid
      become_user: "{{ kafka_user }}"

    - name: Format Kafka storage
      shell: "{{ kafka_dir }}/bin/kafka-storage.sh format -t {{ kafka_uuid.stdout }} -c {{ kafka_dir }}/config/kraft/server.properties"
      become_user: "{{ kafka_user }}"
      args:
        creates: "{{ kafka_dir }}/logs/meta.properties"

    - name: Start and enable Kafka service
      systemd:
        name: kafka
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Install Node.js for Kafka UI
      apt:
        name: nodejs
        state: present

    - name: Install npm
      apt:
        name: npm
        state: present

    - name: Create kafka-ui directory
      file:
        path: /opt/kafka-ui
        state: directory
        mode: '0755'

    - name: Download Kafka UI
      get_url:
        url: "https://github.com/provectus/kafka-ui/releases/download/v0.7.2/kafka-ui-api-v0.7.2.jar"
        dest: /opt/kafka-ui/kafka-ui.jar
        mode: '0644'


    - name: Create Kafka UI systemd service
      copy:
        content: |
          [Unit]
          Description=Kafka UI
          After=kafka.service
          Requires=kafka.service

          [Service]
          Type=simple
          Environment=DYNAMIC_CONFIG_ENABLED=true
          ExecStart=/usr/bin/java -jar /opt/kafka-ui/kafka-ui.jar
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/kafka-ui.service
        mode: '0644'

    - name: Start and enable Kafka UI service
      systemd:
        name: kafka-ui
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Restart Kafka UI if already running
      systemd:
        name: kafka-ui
        state: restarted
      when: ansible_facts.services['kafka-ui.service'] is defined and ansible_facts.services['kafka-ui.service'].state == "running"